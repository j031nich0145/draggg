name: draggg
version: '1.0.13'
summary: macOS-style three-finger drag gestures for Linux touchpads
description: |
  draggg enables macOS-style three-finger drag gestures on Linux touchpads.
  It provides smooth, natural dragging without holding down buttons, making
  it easier to select text and move windows.
  
  Features:
  - Three-finger drag gesture support
  - Customizable sensitivity and thresholds
  - Left-handed mode support
  - Works with X11 (recommended) and Wayland
  - GUI configuration tool
  - Automatic service management

grade: stable
confinement: strict
base: core22

architectures:
  - build-on: [amd64]
    build-for: [amd64]
  - build-on: [amd64]
    build-for: [arm64]

apps:
  draggg:
    command: draggg
    plugs:
      - hardware-observer
      - network
      - x11
    environment:
      DISPLAY: "${DISPLAY}"
    
  draggg-gui:
    command: draggg-gui
    plugs:
      - x11
      - desktop
    desktop: draggg.desktop
    
  draggg-service:
    command: draggg --tray
    daemon: simple
    restart-condition: on-failure
    plugs:
      - hardware-observer
      - network
      - x11
    environment:
      DISPLAY: "${DISPLAY}"

parts:
  draggg:
    plugin: python
    source: .
    python-packages:
      - setuptools
      - wheel
    python-requirements:
      - requirements.txt
    build-packages:
      - python3-dev
      - libevdev-dev
      - libudev-dev
      - gcc
    stage-packages:
      - python3
      - python3-distutils
      - xdotool
      - python3-xlib
    organize:
      assets: $SNAP/assets
      draggg.desktop: $SNAP/meta/gui/draggg.desktop
      draggg.service: $SNAP/draggg.service

plugs:
  uinput:
    interface: raw-usb
    allow-installation: false
  input-devices:
    interface: hardware-observer

hooks:
  configure:
    plugs:
      - desktop
      - x11
