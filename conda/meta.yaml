{% set name = "draggg" %}
{% set version = "1.0.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # For local builds, use path
  path: ..
  # For conda-forge, use PyPI source after publishing:
  # url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/draggg-{{ version }}.tar.gz
  # sha256: <sha256_hash>

build:
  number: 0
  script: python -m pip install . --no-deps --ignore-installed
  entry_points:
    - draggg = draggg:main
    - draggg-gui = draggg_gui:main

requirements:
  build:
    - python
    - setuptools
    - pip
    - wheel
  
  host:
    - python
    - setuptools
  
  run:
    - python
    - evdev >=1.4.0,<1.7.0  # Pinned to avoid PyPI metadata issues in 1.7.0+
    - python-uinput >=0.11.2
    - tk

test:
  imports:
    - draggg
    - config
    - gui
    - gui.setup_wizard
    - gui.settings_panel
  commands:
    - draggg --help
    - draggg-gui --help || true  # GUI may not work in test environment

about:
  home: https://github.com/j031nich0145/draggg
  license: MIT
  license_file: LICENSE
  summary: macOS-style three-finger drag gestures for Linux trackpads
  description: |
    draggg enables macOS-style three-finger drag gestures on Linux trackpads.
    It provides smooth, natural dragging without holding down buttons.
    
    Features:
    - Three-finger drag gesture support
    - Customizable sensitivity and thresholds
    - Left-handed mode support
    - Works with X11 (recommended) and Wayland
    - GUI configuration tool
    - Automatic service management

extra:
  recipe-maintainers:
    - j031nich0145

